name: Build (write env from secrets)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create env file from repository secrets
        run: |
          echo "Creating .env.production from repo secrets"
          cat > .env.production <<EOF
          VITE_BOOK_ID=${{ secrets.VITE_BOOK_ID }}
          VITE_GOOGLE_FILE_ID=${{ secrets.VITE_GOOGLE_FILE_ID }}
          VITE_GOOGLE_API_KEY=${{ secrets.VITE_GOOGLE_API_KEY }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "Working dir: $(pwd)"
          ls -la
          if [ -d ./dist ]; then ls -la ./dist; else echo "dist directory not found"; exit 1; fi

      - name: Deploy to GitHub Pages (push to gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
